[project]
name = "fish-tracker"
version = "0.3.0"
description = "Tracker: contador de salmones por canal (detector YOLO, seguimiento y conteo por tubo)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "deep-sort-realtime>=1.3.2",
    "imageio-ffmpeg>=0.8.1",  # FFmpeg incluido: videos H.264 sin instalar nada en el sistema
    "lap>=0.5.12",            # asignación lineal de ByteTrack
    "matplotlib",
    "numpy",
    "opencv-python",
    "pillow",
    "pyside6>=6.7",           # interfaz de escritorio (src/tracker/gui)
    "pyyaml",
    "scipy>=1.15.3",           # asignación húngara de src/tracker/evaluar_seguimiento.py
    "torch>=2.7",             # 2.7+ con CUDA 12.8 soporta RTX 50 (Blackwell, sm_120)
    "torchvision>=0.22",
    "trackers>=2.7.0 ; python_full_version >= '3.11'",
    "ultralytics==8.4.188",   # versión fija: la API de BYTETracker cambia entre versiones
]

[project.scripts]
tracker = "tracker.cli:main"      # uv run tracker

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracker"]

# Windows y Linux: PyTorch con CUDA 12.8 (RTX 5070 Ti). macOS: PyPI (CPU/MPS).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
