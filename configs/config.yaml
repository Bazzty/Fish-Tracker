# Configuración única del proyecto (Lab 15, contador de salmones).
# Todas las rutas son relativas a la raíz del repositorio.

proyecto:
  semilla: 42
  dispositivo: auto          # auto: GPU 0 si hay CUDA, si no MPS (Mac) o CPU. También: 0, cpu, mps
  clase: fish

rutas:
  datos: data                         # seq_000X/images y seq_000X/labels (no se versiona)
  tracking: data/tracking             # DAT-02: <seq>[_Final]/gt/gt.txt + frames.txt (no se versiona)
  split: configs/split.yaml           # partición por secuencia completa
  conteo_real: configs/conteo_real.yaml
  resultados: resultados              # entrenamientos, evaluaciones y tablas
  pesos: weights                      # weights/yolo26.pt = detector elegido
  salidas: outputs                    # videos anotados y eventos de conteo (no se versiona)

# Entrenamiento completo (el final). Los experimentos cortos usan la sección experimentos.
entrenamiento:
  epocas: 100
  paciencia: 20              # early stopping sobre la métrica de validación
  lote: 16
  workers: 2                 # 2: 159 s/época vs 6: 181 s/época (yolo26n, dat01, RTX 5070 Ti, Windows)
  optimizador: SGD           # explícito: con "auto" Ultralytics ignora lr0 y la grilla no lo probaría
  cache: false               # false | disk | ram (ram puede romper la reproducibilidad)

# Experimentos cortos para elegir el detector YOLO26: 2 modelos x 2 versiones de datos = 4 corridas.
experimentos:
  modelos: [yolo26n.pt, yolo26s.pt]
  datos: [dat01, lab15_dat01]   # A: solo DAT-01 · B: Lab 15 + DAT-01 (ver escribir_data_yaml en src/comun.py)
  epocas: 30
  paciencia: 10
  imgsz: 640
  lr0: 0.001
  empate_map50: 0.01            # diferencias menores son empate: gana el modelo más chico

# Evaluación del detector (mAP). conf bajo es el estándar para calcular mAP.
evaluacion:
  conf: 0.001
  iou: 0.7                   # IoU del NMS
  lote: 16

# Seguimiento y conteo.
conteo:
  linea: 0.50                # fracción del alto desde arriba: línea A de la referencia de conteo (scripts/conteo_referencia.py)
  fps_cuadros: 10            # fps del video anotado armado desde una carpeta de cuadros

criterio:
  map50_val_min: 0.90        # condición previa del detector, en validación
  error_relativo_max: 0.10   # criterio principal, sobre el total de test
