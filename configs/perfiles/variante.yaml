# Variante propia. Los pesos YOLO26 ya existen (weights/yolo26.pt, Bastian). PENDIENTE: el
# tracker y el conteo con histéresis los fija Alonso.
nombre: variante
detector:
  pesos: weights/yolo26.pt
  conf: 0.10
  iou: 0.7
tracker:
  tipo: bytetrack                  # se cambia por el mejor tras la comparación (botsort, ocsort, deepsort)
  config: configs/bytetrack.yaml   # con track_buffer y umbrales ajustados
  match_thresh: 0.8
conteo:
  tipo: histeresis                 # A -> B + filtro de trayectorias cortas + herencia de estado
  min_cuadros: 5
