# Partición de los datos por secuencia completa (nunca por cuadro):
# los cuadros vecinos son casi idénticos y repartirlos entre conjuntos
# filtraría información de train a val/test.
#
# train: entrenamiento
# val:   elegir hiperparámetros, tamaño de modelo y época final
# test:  se usa una sola vez, al final (criterio de éxito)
#
# Las secuencias lab15_* son el etiquetado del profesor (Lab 15) y van SOLO a
# entrenamiento: el detector de la línea base ya se entrenó con ellas, así que
# en validación o test inflarían las métricas y la comparación no diría nada.
# La validación y el test se arman solo con DAT-01, el etiquetado del curso.
#
# Cómo se eligieron las secuencias de DAT-01 (reparto equitativo):
#   1. Tamaño: cerca de 70 % / 15 % / 15 % de los cuadros y de las cajas
#      (train / val / test).
#   2. Dificultad: cada secuencia se clasificó como fácil, media o difícil
#      según la densidad de peces, el % de cuadros con peces superpuestos y
#      las oclusiones fuertes (planilla de analizar_gt.py). Val y test tienen
#      secuencias de los tres niveles, no solo fáciles.
#   3. Dos cambios a mano sobre la propuesta automática, para no dejar en
#      val y test secuencias con casi ningún pez:
#        - seq_00009 (1 pez) pasó a train y seq_00021 (7 peces) a test.
#        - seq_00052 (2 peces) pasó a train y seq_00037 (8 peces) a val.
#   Resultado: 69 % / 16 % / 15 % de los cuadros y 69 % / 16 % / 15 % de las cajas.
#   scripts/preparar_split.py muestra estos porcentajes con los datos actuales.
